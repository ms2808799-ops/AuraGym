<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="main.css">
</head>
<body class="bg-light py-5">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        
        <div class="card shadow-sm p-4">
          <h2 class="text-center mb-4 fw-bold">Complete Your Subscription</h2>

          <div class="alert alert-success d-flex justify-content-between align-items-center mb-4">
            <div>
              <h5 class="mb-0">Selected Plan: <span id="plan-name" class="fw-bold"></span></h5>
            </div>
            <div>
              <h4 class="mb-0 text-success"><span id="plan-price"></span> pound/mo</h4>
            </div>
          </div>

          <form>
            <div class="mb-3">
              <label class="form-label">Full Name</label>
              <input type="text" class="form-control" placeholder="Enter your full name" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Email Address</label>
              <input type="email" class="form-control" placeholder="name@example.com" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Phone Number</label>
              <input type="tel" class="form-control" placeholder="+20..." required>
            </div>

            <hr class="my-4">

            <h5 class="mb-3">Payment Details</h5>
            
            <div class="mb-3">
              <label class="form-label">Card Number</label>
              <input type="text" class="form-control" placeholder="1234 5678 9012 3456" required>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Expiry Date</label>
                <input type="text" class="form-control" placeholder="MM/YY" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">CVV</label>
                <input type="password" class="form-control" placeholder="123" required>
              </div>
            </div>

            <button type="submit" class="btn btn-dark w-100 py-2 mt-3 fw-bold">Confirm & Pay</button>
          </form>

          <div class="text-center mt-3">
            <a href="index.html" class="text-muted text-decoration-none">&larr; Back to Home</a>
          </div>

        </div>

      </div>
    </div>
  </div>

  <script src="main.js"></script>

</body>
</html>
